seed: 42

output:
  output_dir: /home/oscar_while/coding/datasets/unified_dataset_long_run_v1 #/mnt/data3tb/coding/datasets/unified_dataset_long_run_v1
  num_shards: 1024
  buffer_size: 50000          # global buffer before flush (shuffle-ish)
  compression: zstd

image_store:
  dir: images                 # under output_dir
  hash: sha256

start_of_image_token: "<start_of_image>"

datasets:

  pixmo_cap:
    type: pixmo_caption
    path: /mnt/data3tb/coding/datasets/pixmo-cap
    num_samples: 500000

  coco_recaptioned:
    type: coco_recaptioned
    path: /mnt/data3tb/coding/datasets/coco-recaptioned/
    num_samples: 100000
    # If your coco_captions.json uses different keys, set these:
    # image_field: image
    # caption_field: caption

  llava_pretrain:
    type: llava_pretrain
    path: /mnt/data3tb/coding/datasets/llava_pretrain_558k
    num_samples: 500000
    json_file: blip_laion_cc_sbu_558k.json

#---------------- 1,100,000 ---------------------------------------------------------------

  pixmo_ask_model_anything:
    type: pixmo_qa
    path: /mnt/data3tb/coding/datasets/pixmo_ask_model_anything2
    num_samples: 125000
    prompt:
      include_question: true          # if false => prompt is just <start_of_image>
    target:
      from: answer                    # (fixed for this dataset)

  pixmo_cap_qa:
    type: pixmo_cap_qa
    path: /mnt/data3tb/coding/datasets/pixmo_cap_qa
    num_samples: 125000

#---------------- 250,000 ---------------------------------------------------------------

  cosyn_400k_vqa:
    type: cosyn_400k
    path: /mnt/data3tb/coding/datasets/cosyn_400k
    split: train
    per_subset:
      chart: 100000
      chemical: 100000
      circuit: 100000
      diagram: 100000
      document: 100000
      graphic: 100000
      math: 100000
      music: 100000
      nutrition: 100000
      table: 100000

    tasks:
      vqa:
        enabled: true
        target_format: "reasoning_answer"   # Reasoning: ... \n\n Answer: ...

  cosyn_400k_code:
    type: cosyn_400k
    path: /mnt/data3tb/coding/datasets/cosyn_400k
    split: train
    per_subset:
      chart: 5000
      chemical: 5000
      circuit: 5000
      diagram: 5000
      document: 5000
      graphic: 5000
      math: 5000
      music: 5000
      nutrition: 5000
      table: 5000
    tasks:
      code_generation:
        enabled: true
        prompts:
          - "Provide the code to create this figure."
          - "Generate code that reproduces this image."
          - "Write code that renders the visual shown."

#---------------- 1,000,000 ---------------------------------------------------------------

  wikipedia_en:
    type: hf_text
    path: /mnt/data3tb/coding/datasets/wikipedia_text/20231101.en
    num_samples: 200000

  fineweb_edu_10bt:
    type: hf_text
    path: /mnt/data3tb/coding/datasets/fineweb_edu
    num_samples: 200000

